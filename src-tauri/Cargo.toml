[package]
name = "omnibot"
version = "0.1.1"
description = "Omnibot — Local AI bots, projects, and group chats powered by your coding CLIs"
authors = ["Robert Courson <robzilla1738>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/robzilla1738/Omnibot"

[[bin]]
name = "Omnibot"
path = "src/main.rs"

[lib]
name = "omnibot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "process", "time", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7" }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
shlex = "1"
chrono = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-sparkle-updater = "=0.3.0"
