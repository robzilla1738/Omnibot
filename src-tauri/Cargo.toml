[package]
name = "omni-bot"
version = "0.1.0"
description = "Local Multi-Agent Coding Swarm & CLI Control Plane"
authors = ["Robert Courson <robzilla1738>"]
edition = "2021"

[lib]
name = "omni_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "process", "time", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7" }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
dirs = "5"
