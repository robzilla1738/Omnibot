<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="96" y1="48" x2="928" y2="976" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1B28"/>
      <stop offset="50%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#08080D"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="512" cy="500" r="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="48%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="omniBody" x1="256" y1="200" x2="768" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="omniHighlight" x1="340" y1="200" x2="680" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbitGrad" x1="140" y1="512" x2="884" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="35%" stop-color="#EC4899"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="visorGrad" x1="340" y1="384" x2="684" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13131F"/>
      <stop offset="100%" stop-color="#07070D"/>
    </linearGradient>

    <linearGradient id="eyeGrad" x1="0" y1="436" x2="0" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dark squircle with dark outer canvas so no white corners ever appear -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="992" height="992" rx="214" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"/>

  <!-- Subtle Radial Glow -->
  <circle cx="512" cy="500" r="410" fill="url(#coreGlow)"/>

  <!-- Back Half of Orbital Swarm Ring -->
  <g transform="rotate(-18 512 512)">
    <path d="M 146 512 A 366 132 0 0 1 878 512" stroke="url(#orbitGrad)" stroke-width="22" stroke-linecap="round" stroke-opacity="0.35" fill="none"/>
  </g>

  <!-- Top Antenna Spark Node -->
  <path d="M 512 152 L 512 204" stroke="#67E8F9" stroke-width="14" stroke-linecap="round"/>
  <circle cx="512" cy="138" r="24" fill="#67E8F9"/>

  <!-- Sculpted Omni Bot Body -->
  <path d="M 512 196
           C 654 196, 760 278, 778 414
           C 794 536, 750 682, 656 752
           C 598 796, 556 808, 512 808
           C 468 808, 426 796, 368 752
           C 274 682, 230 536, 246 414
           C 264 278, 370 196, 512 196 Z"
        fill="url(#omniBody)"/>

  <!-- Geometric Facet Lines on Body -->
  <path d="M 512 196 L 512 360 M 262 372 L 368 426 M 762 372 L 656 426 M 332 716 L 412 606 M 692 716 L 612 606"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>

  <!-- Glossy Crown Specular Highlight -->
  <path d="M 512 208
           C 630 208, 720 272, 740 384
           C 662 330, 588 312, 512 312
           C 436 312, 362 330, 284 384
           C 304 272, 394 208, 512 208 Z"
        fill="url(#omniHighlight)"/>

  <!-- Bot Inner Visor -->
  <rect x="328" y="384" width="368" height="208" rx="94" fill="url(#visorGrad)" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"/>

  <!-- Left & Right Expressive Bot Eyes -->
  <rect x="410" y="436" width="54" height="104" rx="27" fill="url(#eyeGrad)"/>
  <rect x="560" y="436" width="54" height="104" rx="27" fill="url(#eyeGrad)"/>

  <!-- Eye Specular Glints -->
  <circle cx="426" cy="460" r="10" fill="#FFFFFF"/>
  <circle cx="576" cy="460" r="10" fill="#FFFFFF"/>

  <!-- Front Half of Orbital Swarm Ring + Aligned Satellite Nodes -->
  <g transform="rotate(-18 512 512)">
    <path d="M 878 512 A 366 132 0 0 1 146 512" stroke="url(#orbitGrad)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- Claude Orange Satellite at left of front arc -->
    <circle cx="146" cy="512" r="28" fill="#F97316" stroke="#101018" stroke-width="8"/>
    <!-- Codex Emerald Satellite at right of front arc -->
    <circle cx="878" cy="512" r="28" fill="#10B981" stroke="#101018" stroke-width="8"/>
    <!-- OpenCode Cyan Satellite at bottom of front arc -->
    <circle cx="512" cy="644" r="24" fill="#22D3EE" stroke="#101018" stroke-width="8"/>
  </g>
</svg>
