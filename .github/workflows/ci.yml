name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependency advisories and scoped exceptions
        run: python3 scripts/dependency-audit.py
      - name: Verify release safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Collect dependency licenses and upstream notices
        run: python3 scripts/license-inventory.py
      - name: Upload dependency license inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-license-inventory
          path: |
            release-artifacts/license-inventory.json
            release-artifacts/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 30
      - run: pnpm setup:sparkle
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: pnpm test:rust
      - run: pnpm check:rust
      - run: pnpm exec playwright install chromium webkit
      - name: Chromium browser tests
        run: pnpm test
      - name: WebKit browser tests
        run: pnpm test
        env:
          PLAYWRIGHT_BROWSER: webkit
      - name: Package native app
        # CI has no Developer ID. Disable library validation only in this local debug build;
        # the public release script requires Developer ID and hardened runtime.
        run: pnpm tauri:build --debug --bundles app --config '{"bundle":{"macOS":{"hardenedRuntime":false}}}'
      - name: Native backend smoke with an isolated profile
        shell: bash
        run: |
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            python3 scripts/smoke-local.py --binary src-tauri/target/debug/bundle/macos/Omnibot.app/Contents/MacOS/Omnibot
          else
            echo "Native smoke not run: this runner has no GUI login session. Run the documented native qualification command on macOS before release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
