name: Build macOS release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release-macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== "v" + p.version) throw new Error("Tag must match package.json version");'
      - run: pnpm install --frozen-lockfile
      - name: Build app and DMG
        run: pnpm tauri:build --bundles app,dmg
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Omnibot-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Publish tagged prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/dmg/*.dmg
