name: Build macOS development package
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package-macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build development app (not a public release)
        run: pnpm tauri:build --bundles app
      - name: Archive app preserving permissions and framework symlinks
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/Omnibot.app Omnibot-development.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Omnibot-development
          path: Omnibot-development.zip
          if-no-files-found: error
          retention-days: 7
# Public releases use scripts/release-macos.py on the signing Mac.
# Local Keychain credentials are not available on GitHub-hosted runners.
